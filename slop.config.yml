packs:
  placement-slop: true

# The three evidence-class rules default to warn upstream; block them here
# so the placement-guard CI job actually fails on a home path or an
# unlisted org marker in an instruction file instead of only warning.
rules:
  placement-slop/dated-evidence:
    severity: block
  placement-slop/tally-phrase:
    severity: block
  placement-slop/opaque-id:
    severity: block

placement:
  instructionGlobs:
    - "packages/orchestrator-workflow/assets/**/*.md"
    - "packages/agentic-coding-playbook/**/*.md"
    # Package READMEs: reusable per-package doc surface, same leak risk as
    # SKILL.md/AGENTS.md. "packages/*/README.md" covers every package's own
    # top-level README; the repo-root README.md is deliberately NOT
    # covered (it is the monorepo overview, not a single package's own
    # doc).
    #
    # OKF bundle docs (packages/*/docs/okf/**) are deliberately NOT
    # covered by this pack at all: those docs carry verification stamps,
    # tallies, and task ids by design, and the bundle already has its own
    # mechanical freshness guard. See packages/slop-detector/CHANGELOG.md
    # for the rationale and the corpus measurements behind both decisions.
    - "packages/*/README.md"
  markers:
    - "LanNguyenSi"
  allow:
    - "https://github\\.com/LanNguyenSi/"
    - "https://raw\\.githubusercontent\\.com/LanNguyenSi/"
    # A bare "~/" is portable by construction: unlike "/Users/<name>/" or
    # "/home/<name>/", it never bakes in a literal username, so it carries
    # no machine-bound information to leak. Deliberately narrow: matches
    # only the two literal characters "~/", so "/Users/<realname>/" and
    # "/home/<realname>/" still fire. See CHANGELOG for the measurement
    # behind this entry.
    - "~/"
    # Same reasoning, for a README that spells the generic placeholder as
    # the literal word "you" instead of an angle-bracket placeholder.
    # Exact literal match, cannot match a real username.
    - "/Users/you/"
