name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only the npm packages are matrix entries. `agent-engineering-playbook`
# and `agentic-coding-playbook` are pure documentation directories (no
# package.json), and `scaffoldkit` is a Python sub-package (handled in its
# own toolchain), so nothing to build/test for those here.
jobs:
  placement-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/slop-detector/package-lock.json

      - name: Install slop-detector
        working-directory: packages/slop-detector
        run: npm ci

      - name: Build slop-detector
        working-directory: packages/slop-detector
        run: npm run build

      - name: Check for org-, machine-, or point-in-time-bound evidence in instruction files
        run: node packages/slop-detector/dist/cli.js check . --pack placement-slop --config slop.config.yml

  # Fails the build (not just a warning) on anchor-check drift in
  # packages/orchestrator-workflow/docs/okf -- the warn-only
  # okf-staleness.yml drift watch never blocks (see its own header
  # comment) before okf-kit's anchored citations (0.6.0). See
  # packages/orchestrator-workflow/docs/okf/log.md for the rule contract,
  # the anchor count, and the residual gap this does not close. Note:
  # master carries no required-status-check branch protection today, so
  # "fails the build" means this job's own run goes red, not an enforced
  # merge block; that is an orchestrator decision, not a branch-protection
  # change. If packages/orchestrator-workflow/docs/okf is ever moved or
  # renamed, update BUNDLE_PATH below in the same PR.
  okf-anchor-guard:
    name: OKF bundle anchor guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUNDLE_PATH: packages/orchestrator-workflow/docs/okf
    steps:
      - uses: actions/checkout@v4
        with:
          # citations-resolve's repo-root auto-detection runs `git
          # rev-parse --show-toplevel`; it does not itself need commit
          # history, but a full checkout keeps this job's checkout
          # identical to okf-staleness.yml's rather than a second,
          # subtly different recipe to keep in sync.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install okf-kit (exact pin)
        # Keep this pin identical to okf-staleness.yml's; both are pinned
        # against packages/okf-kit/package.json's version by
        # test/docs-consistency.test.ts (globs every .github/workflows/
        # file for an okf-kit@<version> pin, install or npx form). The
        # --require-anchors flag used below turns on citations-resolve's
        # four opt-in rules: anchor-required, anchor-not-on-last-line,
        # anchor-not-unique-in-range, and test-range-straddles-block (see
        # the "Anchor-citation guard" step further down). That flag is
        # not yet on this pinned version, so this job is expected to go
        # red once it reaches that step, until the pin advances past an
        # okf-kit release that ships it. Sequencing/coordination
        # evidence: see docs/okf/log.md.
        run: npm install -g okf-kit@0.7.0

      - name: Assert CLI is alive (output, not exit code)
        shell: bash
        run: |
          v="$(okf-kit --version)"
          test -n "$v"
          echo "okf-kit ${v}"

      - name: Self-test the anchor-finding filter against a deliberately drifted fixture
        # Guards the jq pipeline below, not the bundle: builds a throwaway
        # OKF bundle under $RUNNER_TEMP that exercises all six anchor-
        # family findings the guard's jq filter matches: a heading-
        # anchored citation and a string-anchored one (the vast majority
        # of this bundle's real anchors are string-form; the heading form
        # covers only CHANGELOG.md's citations, see docs/okf/log.md for
        # the live counts -- not hand-copied here since they drift as
        # citations are added or re-pointed), plus one deliberate
        # violation of each of --require-anchors' four opt-in rules
        # (anchor-required, anchor-not-on-last-line,
        # anchor-not-unique-in-range, test-range-straddles-block). The
        # first two are produced by drifting the same two citations'
        # ranges (repointing each at Section A's lines while its anchor
        # text still names Section B, without touching the doc's own
        # citation text -- the same "range moved, anchor didn't" shape
        # the real guard exists to catch); the four opt-in-rule
        # violations are appended fresh instead, since "carries no
        # #anchor at all" has no valid form to drift from. If the same jq
        # filter used against the real bundle below does not report at
        # least one finding per family against this fixture, the filter
        # itself is broken (a regex typo, a schema change upstream) and
        # this step fails red before the real check ever gets a chance to
        # pass green for the wrong reason. The clean (pre-drift, pre-
        # append) run's own report is also asserted at 0 anchor findings,
        # so a fixture that is already broken before the drift cannot
        # pass this self-test for the wrong reason either.
        shell: bash
        run: |
          set -e
          fixture="${RUNNER_TEMP}/okf-anchor-selftest"
          rm -rf "${fixture}"
          mkdir -p "${fixture}/src" "${fixture}/bundle"
          # citations-resolve needs a real repo root (git rev-parse
          # --show-toplevel); give the fixture its own tiny one rather
          # than relying on this checkout's root, so the self-test is
          # fully self-contained.
          (cd "${fixture}" && git init -q && git config user.email t@t.co && git config user.name t)
          printf '%s\n' \
            '## Section A' \
            '' \
            'line a1' \
            'line a2' \
            '' \
            '## Section B' \
            '' \
            'line b1' \
            'line b2' \
            '' \
            '## Section C' \
            '' \
            'line c1' \
            'line c2' \
            'line c2' \
            '' \
            '## Section D' \
            '' \
            'line d1' \
            'line d2' \
            > "${fixture}/src/target.md"
          printf '%s\n' \
            "describe('d', () => {" \
            "  it('one', () => {" \
            "    doThing();" \
            "  });" \
            "  it('two', () => {" \
            "    doOther();" \
            "  });" \
            "});" \
            > "${fixture}/src/target.test.ts"
          printf '%s\n' \
            '---' \
            'type: module' \
            'timestamp: "2026-01-01T00:00:00Z"' \
            'sources:' \
            '  - src/target.md' \
            '  - src/target.test.ts' \
            '---' \
            '' \
            '# Fixture doc' \
            '' \
            'Cites `src/target.md:8-9#B` (Section B, correctly anchored for now)' \
            'and `src/target.md:9#"line b2"` (string-anchored, also correct for now).' \
            > "${fixture}/bundle/doc.md"
          (cd "${fixture}" && git add -A && git commit -q -m init)
          set +e
          okf-kit check --json "${fixture}/bundle" --require-anchors > "${fixture}/selftest-clean-report.json"
          set -e
          clean_count=$(jq '[
            .findings[] | select(.message | test("\\[(anchor-[a-z-]+|test-range-straddles-block)\\]$"))
          ] | length' "${fixture}/selftest-clean-report.json")
          if [ "${clean_count}" -ne 0 ]; then
            echo "::error title=OKF anchor guard self-test failed::the clean, pre-drift fixture already reports ${clean_count} anchor finding(s) (expected 0); the fixture itself is broken, not just the drift"
            cat "${fixture}/selftest-clean-report.json"
            exit 1
          fi
          # Drift the two existing citations (see the step comment above),
          # then append one fresh violation of each --require-anchors
          # opt-in rule: an unanchored full citation (anchor-required), a
          # single-occurrence anchor sitting on the range's first line
          # rather than its last content line (anchor-not-on-last-line),
          # an anchor text occurring on two lines of its own range
          # (anchor-not-unique-in-range), and a full citation into the
          # fixture's own *.test.ts file whose range crosses into a
          # second it() block's head (test-range-straddles-block).
          python3 -c "
          p = '${fixture}/bundle/doc.md'
          c = open(p).read()
          c = c.replace('src/target.md:8-9#B', 'src/target.md:3-4#B')
          c = c.replace('src/target.md:9#\"line b2\"', 'src/target.md:4#\"line b2\"')
          c += '''
          Also cites src/target.md:3-4 with no anchor at all (anchor-required).
          and src/target.md:19-20#\"line d1\" (anchor-not-on-last-line).
          and src/target.md:13-15#\"line c2\" (anchor-not-unique-in-range).
          and src/target.test.ts:2-6#\"doOther();\" (test-range-straddles-block).
          '''
          open(p, 'w').write(c)
          "
          set +e
          okf-kit check --json "${fixture}/bundle" --require-anchors > "${fixture}/selftest-report.json"
          set -e
          heading_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-heading-"))
          ] | length' "${fixture}/selftest-report.json")
          string_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-not-found-in-range\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          required_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-required\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          last_line_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-not-on-last-line\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          unique_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-not-unique-in-range\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          straddle_count=$(jq '[
            .findings[] | select(.message | test("\\[test-range-straddles-block\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          # Each of the six anchor families is asserted separately, not
          # just a combined total -- a filter or okf-kit regression that
          # silently stopped catching one family could otherwise pass this
          # gate on another family's finding alone.
          if [ "${heading_count}" -lt 1 ] || [ "${string_count}" -lt 1 ] || [ "${required_count}" -lt 1 ] || [ "${last_line_count}" -lt 1 ] || [ "${unique_count}" -lt 1 ] || [ "${straddle_count}" -lt 1 ]; then
            echo "::error title=OKF anchor guard self-test failed::the anchor-finding jq filter reported ${heading_count} heading-form, ${string_count} string-form, ${required_count} anchor-required, ${last_line_count} anchor-not-on-last-line, ${unique_count} anchor-not-unique-in-range, and ${straddle_count} test-range-straddles-block finding(s) against a fixture with one deliberate violation of each (expected >= 1 each); the filter or okf-kit's finding shape changed under this job"
            cat "${fixture}/selftest-report.json"
            exit 1
          fi
          echo "Self-test OK: ${heading_count} heading-form, ${string_count} string-form, ${required_count} anchor-required, ${last_line_count} anchor-not-on-last-line, ${unique_count} anchor-not-unique-in-range, ${straddle_count} test-range-straddles-block finding(s) against the drifted fixture."

      - name: Anchor-citation guard
        shell: bash
        run: |
          set +e
          # --require-anchors turns on the four opt-in checks named in
          # the Install step above; --require-anchors-allow exempts
          # README.md and INSTALL-AGENT.md (documentation-category
          # citations, not kit-source) -- an exact-match list of the four
          # spellings this bundle's own citation text actually uses (both
          # the bare and the `packages/orchestrator-workflow/`-prefixed
          # form), not a glob: matchesAllowPattern (citations-resolve.ts)
          # does a plain `pattern === citedPath` string comparison when a
          # pattern carries no `*`/`?`, so each spelling needs its own
          # exact entry here rather than a wildcard covering all of them.
          # Follow-up: anchoring the 19 citations this allowlist
          # currently exempts, then dropping the allowlist entirely (see
          # docs/okf/log.md).
          okf-kit check --json "${BUNDLE_PATH}" \
            --require-anchors \
            --require-anchors-allow \
              'README.md' \
              'packages/orchestrator-workflow/README.md' \
              'INSTALL-AGENT.md' \
              'packages/orchestrator-workflow/INSTALL-AGENT.md' \
            > okf-anchor-report.json
          code=$?
          set -e

          if [ "${code}" -ne 0 ] && [ "${code}" -ne 1 ]; then
            echo "::error title=OKF anchor guard::okf-kit check exited ${code} (tool/usage error, not bundle findings)"
            cat okf-anchor-report.json || true
            exit "${code}"
          fi

          jq -e . okf-anchor-report.json > /dev/null

          # Anchor rule ids are embedded as a "[rule-id]" suffix on the
          # citations-resolve finding's message (okf-kit's top-level
          # ruleId is always "citations-resolve"); match any anchor-*
          # rule id rather than a hardcoded list, so a future okf-kit
          # release adding a fifth anchor rule is covered without an edit
          # here (the self-test step above guards this same filter). Also
          # matches test-range-straddles-block by name: one of
          # --require-anchors' own four opt-in rules (see the Install
          # step above), but its id does not start with "anchor-" so the
          # wildcard above does not already cover it.
          anchorFindings=$(jq '[
            .findings[]
            | select(.message | test("\\[(anchor-[a-z-]+|test-range-straddles-block)\\]$"))
          ]' okf-anchor-report.json)
          count=$(echo "${anchorFindings}" | jq 'length')

          {
            echo "## OKF bundle anchor guard (\`${BUNDLE_PATH}\`)"
            echo ""
            echo "anchor findings: ${count}"
            if [ "${count}" -gt 0 ]; then
              echo ""
              echo '```'
              echo "${anchorFindings}" | jq -r '.[] | "\(.file): \(.message)"'
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${count}" -gt 0 ]; then
            echo "${anchorFindings}" | jq -r '.[] | "::error title=OKF anchor drift::\(.file): \(.message)"'
            exit 1
          fi

          echo "Clean, 0 anchor findings."
          exit 0

  lint-cli-flag-order:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check commander flag order (-short, --long)
        run: node scripts/check-cli-flag-order.mjs

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - agent-dev-kit
          - friction-log
          - git-batch-cli
          - github-api-tool
          - mcp-token-audit
          - okf-kit
          - orchestrator-workflow
          - slop-detector
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Typecheck (test files)
        shell: bash
        run: |
          if node -e "process.exit((require('./package.json').scripts || {})['typecheck:test'] ? 0 : 1)"; then
            npm run typecheck:test
          elif [ -f tsconfig.json ]; then
            echo "::error::package has a tsconfig.json but no typecheck:test script - test files would go untypechecked"
            exit 1
          else
            echo "No tsconfig.json (plain JS package), skipping test typecheck"
          fi

      - name: Build
        run: npm run build --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        shell: bash
        run: |
          if node -e "process.exit((require('./package.json').scripts || {})['test:ci'] ? 0 : 1)"; then
            echo "Running npm run test:ci"
            npm run test:ci
          else
            echo "test:ci not defined, falling back to npm test"
            npm test --if-present
          fi
