name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only the npm packages are matrix entries. `agent-engineering-playbook`
# and `agentic-coding-playbook` are pure documentation directories (no
# package.json), and `scaffoldkit` is a Python sub-package (handled in its
# own toolchain), so nothing to build/test for those here.
jobs:
  placement-guard:
    runs-on: ubuntu-latest
    # 5 minutes, not 2: installing slop-detector's dependencies alone takes
    # around 100 seconds on a slow registry day, and npm ci's implicit audit
    # request can stall on the registry's advisory endpoint. --no-audit keeps
    # the install from waiting on that endpoint at all; the audit is not what
    # this job is for.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/slop-detector/package-lock.json

      - name: Install slop-detector
        working-directory: packages/slop-detector
        run: npm ci --no-audit --no-fund

      - name: Build slop-detector
        working-directory: packages/slop-detector
        run: npm run build

      - name: Check for org-, machine-, or point-in-time-bound evidence in instruction files
        run: node packages/slop-detector/dist/cli.js check . --pack placement-slop --config slop.config.yml

  bundle-prose-guard:
    name: OKF bundle prose guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/slop-detector/package-lock.json

      - name: Install slop-detector
        working-directory: packages/slop-detector
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build slop-detector
        working-directory: packages/slop-detector
        shell: bash
        run: npm run build

      - name: Check the orchestrator-workflow OKF bundle for prose slop
        shell: bash
        run: node packages/slop-detector/dist/cli.js check packages/orchestrator-workflow/docs/okf --pack prose-slop --config slop.bundle.config.yml

  review-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/slop-detector/package-lock.json

      - name: Install slop-detector
        working-directory: packages/slop-detector
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build slop-detector
        working-directory: packages/slop-detector
        shell: bash
        run: npm run build

      - name: Check for run-local review references in reusable content
        shell: bash
        run: node packages/slop-detector/dist/cli.js check . --pack review-slop --config slop.config.yml

  # Separate job from placement-guard above (same slop-detector CLI, a
  # different pack): this one is a security control over
  # `.github/workflows/*.yml`, not a doc-hygiene lint, so it gets its own
  # status check name rather than riding on placement-guard's. It runs all
  # five rules in `workflow-slop`: `run-expression` (GitHub Actions `run:`
  # expression injection), `unparseable-workflow` (a scanned workflow file
  # that did not parse as YAML), `node20-action-major` (a reintroduced
  # Node-20 action major), `audit-gate-missing` (an audit.yml with no
  # certifiable npm-audit gate) and `audit-gate-shape` (an npm-audit gate
  # step whose shape the pack does not recognise). See
  # packages/slop-detector/docs/workflow-slop.md
  # "workflow-slop by example" for the rules, the allowlist/data-list
  # config surface, and the sources behind them, and
  # packages/slop-detector/CHANGELOG.md for why this is a new pack rather
  # than a rule inside an existing one.
  workflow-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/slop-detector/package-lock.json

      - name: Install slop-detector
        working-directory: packages/slop-detector
        run: npm ci --no-audit --no-fund

      - name: Build slop-detector
        working-directory: packages/slop-detector
        run: npm run build

      - name: "Check .github/workflows/*.yml for run: expression injection, Node-20 action majors, and audit-gate shape"
        run: node packages/slop-detector/dist/cli.js check . --pack workflow-slop --config slop.config.yml

  # Fails the build (not just a warning) on anchor-check drift in
  # packages/orchestrator-workflow/docs/okf -- the warn-only
  # okf-staleness.yml drift watch never blocks (see its own header
  # comment) before okf-kit's anchored citations (0.6.0). See
  # packages/orchestrator-workflow/docs/okf/log.md for the rule contract,
  # the anchor count, and the residual gap this does not close. Note:
  # master carries no required-status-check branch protection today, so
  # "fails the build" means this job's own run goes red, not an enforced
  # merge block; that is an orchestrator decision, not a branch-protection
  # change. If packages/orchestrator-workflow/docs/okf is ever moved or
  # renamed, update BUNDLE_PATH below in the same PR.
  okf-anchor-guard:
    name: OKF bundle anchor guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUNDLE_PATH: packages/orchestrator-workflow/docs/okf
      # Read by BOTH the "Self-test the freshness-finding filter" step and
      # the real "Freshness guard" step below, so an edit to the filter is
      # exercised by the self-test instead of the self-test guarding a
      # separately hand-kept copy of it. The full `[.findings[] | ...]`
      # array expression lives here too (not just the inner
      # select-expression), so each consuming step only appends `| length`
      # (or reads the array directly) rather than hand-keeping the
      # `.findings[]` wrapper in more than one place.
      FRESHNESS_FILTER: '[.findings[] | select(.ruleId == "sources-fresh" or .ruleId == "sources-fresh-future") | select(.severity != "notice")]'
    steps:
      - uses: actions/checkout@v5
        with:
          # citations-resolve's repo-root auto-detection runs `git
          # rev-parse --show-toplevel`; it does not itself need commit
          # history, but a full checkout keeps this job's checkout
          # identical to okf-staleness.yml's rather than a second,
          # subtly different recipe to keep in sync.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install okf-kit (exact pin, unpublished-pin fallback)
        # Keep this pin identical to okf-staleness.yml's; both are pinned
        # against packages/okf-kit/package.json's version by
        # test/docs-consistency.test.ts (globs every .github/workflows/
        # file for an okf-kit@<version> pin, install or npx form). The
        # --require-anchors flag used below turns on citations-resolve's
        # four opt-in rules: anchor-required, anchor-not-on-last-line,
        # anchor-not-unique-in-range, and test-range-straddles-block (see
        # the "Anchor-citation guard" step further down).
        #
        # Probe the pin with `npm view okf-kit@<pin> version` first:
        # published, install exactly as before, no drift. If that probe
        # fails, confirm with a package-level probe (`npm view okf-kit
        # versions --json`) before deciding anything: if the pin turns up
        # in that list after all, install it exactly like a published pin;
        # if the probe confirms the pin is genuinely absent, build
        # packages/okf-kit from the PR tree and install that build when
        # the pin equals packages/okf-kit/package.json's version in this
        # tree (a release PR in flight, see CONTRIBUTING.md "Releasing
        # okf-kit"), or fail loudly when it does not (a stale bump, a
        # typo). Any failure of the package-level probe itself is a
        # registry/network error, never "unpublished": fail loudly rather
        # than guess. Each path prints one line naming which branch ran.
        # This fallback branch is agent-dx-specific: only this repo builds
        # okf-kit from its own tree (see okf-staleness.yml's header
        # comment, which is the pattern other repos with a docs/okf bundle
        # copy).
        #
        # Evidence: see packages/orchestrator-workflow/docs/okf/log.md.
        shell: bash
        run: |
          install_cmd=(npm install -g okf-kit@0.16.0 --no-audit --no-fund)
          pin="${install_cmd[3]#*okf-kit@}"

          view_out="$(mktemp)"
          view_err="$(mktemp)"
          set +e
          npm view "okf-kit@${pin}" version >"${view_out}" 2>"${view_err}"
          view_exit=$?
          set -e
          view_stdout="$(cat "${view_out}")"
          view_stderr="$(cat "${view_err}")"
          rm -f "${view_out}" "${view_err}"

          if [ "${view_exit}" -eq 0 ] && [ -n "${view_stdout}" ]; then
            echo "okf-kit install path: published-pin (okf-kit@${pin})"
            "${install_cmd[@]}"
            exit 0
          fi

          hint="no E404/ETARGET code seen (informational only, not decisive)"
          case "${view_stderr}" in
            *'code E404'*) hint="stderr showed code E404 (informational only, not decisive)" ;;
            *'code ETARGET'*) hint="stderr showed code ETARGET (informational only, not decisive)" ;;
          esac

          versions_out="$(mktemp)"
          versions_err="$(mktemp)"
          set +e
          npm view okf-kit versions --json >"${versions_out}" 2>"${versions_err}"
          versions_exit=$?
          set -e
          versions_stdout="$(cat "${versions_out}")"
          versions_stderr="$(cat "${versions_err}")"
          rm -f "${versions_out}" "${versions_err}"

          versions_json_valid=0
          if [ "${versions_exit}" -eq 0 ] && [ -n "${versions_stdout}" ]; then
            if node -e 'const v = JSON.parse(process.argv[1]); if (!Array.isArray(v)) process.exit(1);' "${versions_stdout}" >/dev/null 2>&1; then
              versions_json_valid=1
            fi
          fi

          if [ "${versions_json_valid}" -ne 1 ]; then
            echo "okf-kit install path: registry-error (fail)"
            single_line_view_stderr="${view_stderr//$'\n'/ }"
            echo "::error title=okf-kit install::npm view okf-kit@${pin} version failed (exit ${view_exit}, ${hint}) and npm view okf-kit versions --json could not confirm it is unpublished (exit ${versions_exit}); refusing to guess: ${single_line_view_stderr}" >&2
            echo "npm view okf-kit@${pin} version stderr:"
            printf '%s\n' "${view_stderr}" | sed 's/^/  /'
            echo "npm view okf-kit versions --json stderr:"
            printf '%s\n' "${versions_stderr}" | sed 's/^/  /'
            if [ "${versions_exit}" -eq 0 ]; then
              exit 1
            fi
            exit "${versions_exit}"
          fi

          pin_in_versions=0
          if node -e 'const v = JSON.parse(process.argv[1]); process.exit(v.includes(process.argv[2]) ? 0 : 1);' "${versions_stdout}" "${pin}" >/dev/null 2>&1; then
            pin_in_versions=1
          fi

          if [ "${pin_in_versions}" -eq 1 ]; then
            echo "okf-kit install path: published-pin (okf-kit@${pin}, confirmed via okf-kit versions probe; ${hint})"
            "${install_cmd[@]}"
            exit 0
          fi

          pkg_version="$(node -p "require('./packages/okf-kit/package.json').version" 2>/dev/null)" || {
            echo "::error title=okf-kit install::cannot read packages/okf-kit/package.json" >&2
            exit 1
          }
          if [ -z "${pkg_version}" ]; then
            echo "::error title=okf-kit install::cannot read packages/okf-kit/package.json" >&2
            exit 1
          fi

          if [ "${pin}" = "${pkg_version}" ]; then
            echo "okf-kit install path: unpublished-pin-build-from-tree (okf-kit@${pin} == packages/okf-kit/package.json)"
            (cd packages/okf-kit && npm ci --no-audit --no-fund && npm run build)
            npm install -g ./packages/okf-kit --no-audit --no-fund
          else
            echo "okf-kit install path: unpublished-pin-mismatch (fail)"
            echo "::error title=okf-kit install::pin okf-kit@${pin} is confirmed unpublished (via npm view okf-kit versions --json) and does not equal packages/okf-kit/package.json's version (${pkg_version}); refusing to install" >&2
            exit 1
          fi

      - name: Assert CLI is alive (output, not exit code)
        shell: bash
        run: |
          v="$(okf-kit --version)"
          test -n "$v"
          echo "okf-kit ${v}"

      - name: Self-test the anchor-finding filter against a deliberately drifted fixture
        # Guards the jq pipeline below, not the bundle: builds a throwaway
        # OKF bundle under $RUNNER_TEMP that exercises all seven anchor-
        # family findings the guard's jq filter matches: a heading-
        # anchored citation, a string-anchored one, and a heading-section-
        # form citation (`path:#heading`, okf-kit 0.8.0's line-independent
        # citation form; the vast majority of this bundle's real anchors
        # are string-form, the heading and heading-section forms cover
        # only CHANGELOG.md's citations, see docs/okf/log.md for the live
        # counts -- not hand-copied here since they drift as citations
        # are added or re-pointed), plus one deliberate violation of each
        # of --require-anchors' four opt-in rules (anchor-required,
        # anchor-not-on-last-line, anchor-not-unique-in-range,
        # test-range-straddles-block). The heading and string findings are
        # produced by drifting the same two citations' ranges (repointing
        # each at Section A's lines while its anchor text still names
        # Section B, without touching the doc's own citation text -- the
        # same "range moved, anchor didn't" shape the real guard exists
        # to catch); the heading-section citation has no line range to
        # drift, so it is instead repointed at a heading that never
        # exists (`Z`) -- the shape a heading-section citation actually
        # breaks in; the four opt-in-rule violations are appended fresh
        # instead, since "carries no #anchor at all" has no valid form to
        # drift from. If the same jq filter used against the real bundle
        # below does not report at least one finding per family against
        # this fixture, the filter itself is broken (a regex typo, a
        # schema change upstream) and this step fails red before the real
        # check ever gets a chance to pass green for the wrong reason.
        # The clean (pre-drift, pre-append) run's own report is also
        # asserted at 0 anchor findings, so a fixture that is already
        # broken before the drift cannot pass this self-test for the
        # wrong reason either.
        shell: bash
        run: |
          set -e
          # Rejects a non-numeric (usually empty) count before it reaches a
          # `[ "${x}" -ne 0 ]`/`-lt` comparison below: an empty string there
          # is a shell usage error inside an `if` condition, which `set -e`
          # does not catch (condition commands are exempt), so the step
          # would silently fall through to "Self-test OK" instead of
          # failing. This is the guard that turns a truncated or malformed
          # okf-kit report into a hard failure instead of a false green.
          assert_numeric() {
            case "$2" in
              ''|*[!0-9]*)
                echo "::error title=OKF anchor guard self-test failed::${1} is not a numeric finding count (got \"${2}\"); the jq pipeline produced no usable output, most likely from an okf-kit CLI failure with empty or malformed stdout"
                exit 1
                ;;
            esac
          }
          fixture="${RUNNER_TEMP}/okf-anchor-selftest"
          rm -rf "${fixture}"
          mkdir -p "${fixture}/src" "${fixture}/bundle"
          # citations-resolve needs a real repo root (git rev-parse
          # --show-toplevel); give the fixture its own tiny one rather
          # than relying on this checkout's root, so the self-test is
          # fully self-contained.
          (cd "${fixture}" && git init -q && git config user.email t@t.co && git config user.name t)
          printf '%s\n' \
            '## Section A' \
            '' \
            'line a1' \
            'line a2' \
            '' \
            '## Section B' \
            '' \
            'line b1' \
            'line b2' \
            '' \
            '## Section C' \
            '' \
            'line c1' \
            'line c2' \
            'line c2' \
            '' \
            '## Section D' \
            '' \
            'line d1' \
            'line d2' \
            > "${fixture}/src/target.md"
          printf '%s\n' \
            "describe('d', () => {" \
            "  it('one', () => {" \
            "    doThing();" \
            "  });" \
            "  it('two', () => {" \
            "    doOther();" \
            "  });" \
            "});" \
            > "${fixture}/src/target.test.ts"
          printf '%s\n' \
            '---' \
            'type: module' \
            'timestamp: "2026-01-01T00:00:00Z"' \
            'sources:' \
            '  - src/target.md' \
            '  - src/target.test.ts' \
            '---' \
            '' \
            '# Fixture doc' \
            '' \
            'Cites `src/target.md:8-9#B` (Section B, correctly anchored for now),' \
            '`src/target.md:9#"line b2"` (string-anchored, also correct for now),' \
            'and `src/target.md:#B` (heading-section form, also correct for now).' \
            > "${fixture}/bundle/doc.md"
          (cd "${fixture}" && git add -A && git commit -q -m init)
          set +e
          okf-kit check --json "${fixture}/bundle" --require-anchors > "${fixture}/selftest-clean-report.json"
          clean_code=$?
          set -e
          if [ "${clean_code}" -ne 0 ] && [ "${clean_code}" -ne 1 ]; then
            echo "::error title=OKF anchor guard self-test failed::okf-kit check (clean fixture) exited ${clean_code} (tool/usage error, not bundle findings)"
            cat "${fixture}/selftest-clean-report.json" || true
            exit "${clean_code}"
          fi
          jq -e . "${fixture}/selftest-clean-report.json" > /dev/null
          clean_count=$(jq '[
            .findings[] | select(.message | test("\\[(anchor-[a-z-]+|heading-section-[a-z-]+|test-range-straddles-block)\\]$"))
          ] | length' "${fixture}/selftest-clean-report.json")
          assert_numeric clean_count "${clean_count}"
          if [ "${clean_count}" -ne 0 ]; then
            echo "::error title=OKF anchor guard self-test failed::the clean, pre-drift fixture already reports ${clean_count} anchor finding(s) (expected 0); the fixture itself is broken, not just the drift"
            cat "${fixture}/selftest-clean-report.json"
            exit 1
          fi
          # Drift the two existing citations (heading-form and
          # string-form; see the step comment above): repoint each at
          # Section A's lines while its anchor text still names Section
          # B, without touching the doc's own citation text -- the same
          # "range moved, anchor didn't" shape the real guard exists to
          # catch. The third, heading-section citation has no line range
          # to drift, so it is instead repointed at a heading that never
          # exists (`Z`) -- the shape a heading-section citation actually
          # breaks in. Then append one fresh violation of each
          # --require-anchors opt-in rule: an unanchored full citation
          # (anchor-required), a single-occurrence anchor sitting on the
          # range's first line rather than its last content line
          # (anchor-not-on-last-line), an anchor text occurring on two
          # lines of its own range (anchor-not-unique-in-range), and a
          # full citation into the fixture's own *.test.ts file whose
          # range crosses into a second it() block's head
          # (test-range-straddles-block).
          python3 -c "
          p = '${fixture}/bundle/doc.md'
          c = open(p).read()
          c = c.replace('src/target.md:8-9#B', 'src/target.md:3-4#B')
          c = c.replace('src/target.md:9#\"line b2\"', 'src/target.md:4#\"line b2\"')
          c = c.replace('src/target.md:#B', 'src/target.md:#Z')
          c += '''
          Also cites src/target.md:3-4 with no anchor at all (anchor-required).
          and src/target.md:19-20#\"line d1\" (anchor-not-on-last-line).
          and src/target.md:13-15#\"line c2\" (anchor-not-unique-in-range).
          and src/target.test.ts:2-6#\"doOther();\" (test-range-straddles-block).
          '''
          open(p, 'w').write(c)
          "
          set +e
          okf-kit check --json "${fixture}/bundle" --require-anchors > "${fixture}/selftest-report.json"
          drift_code=$?
          set -e
          if [ "${drift_code}" -ne 0 ] && [ "${drift_code}" -ne 1 ]; then
            echo "::error title=OKF anchor guard self-test failed::okf-kit check (drifted fixture) exited ${drift_code} (tool/usage error, not bundle findings)"
            cat "${fixture}/selftest-report.json" || true
            exit "${drift_code}"
          fi
          jq -e . "${fixture}/selftest-report.json" > /dev/null
          heading_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-heading-"))
          ] | length' "${fixture}/selftest-report.json")
          assert_numeric heading_count "${heading_count}"
          string_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-not-found-in-range\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          assert_numeric string_count "${string_count}"
          required_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-required\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          assert_numeric required_count "${required_count}"
          last_line_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-not-on-last-line\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          assert_numeric last_line_count "${last_line_count}"
          unique_count=$(jq '[
            .findings[] | select(.message | test("\\[anchor-not-unique-in-range\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          assert_numeric unique_count "${unique_count}"
          straddle_count=$(jq '[
            .findings[] | select(.message | test("\\[test-range-straddles-block\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          assert_numeric straddle_count "${straddle_count}"
          heading_section_count=$(jq '[
            .findings[] | select(.message | test("\\[heading-section-[a-z-]+\\]$"))
          ] | length' "${fixture}/selftest-report.json")
          assert_numeric heading_section_count "${heading_section_count}"
          # Each of the seven anchor families is asserted separately, not
          # just a combined total -- a filter or okf-kit regression that
          # silently stopped catching one family could otherwise pass this
          # gate on another family's finding alone.
          if [ "${heading_count}" -lt 1 ] || [ "${string_count}" -lt 1 ] || [ "${required_count}" -lt 1 ] || [ "${last_line_count}" -lt 1 ] || [ "${unique_count}" -lt 1 ] || [ "${straddle_count}" -lt 1 ] || [ "${heading_section_count}" -lt 1 ]; then
            echo "::error title=OKF anchor guard self-test failed::the anchor-finding jq filter reported ${heading_count} heading-form, ${string_count} string-form, ${required_count} anchor-required, ${last_line_count} anchor-not-on-last-line, ${unique_count} anchor-not-unique-in-range, ${straddle_count} test-range-straddles-block, and ${heading_section_count} heading-section-form finding(s) against a fixture with one deliberate violation of each (expected >= 1 each); the filter or okf-kit's finding shape changed under this job"
            cat "${fixture}/selftest-report.json"
            exit 1
          fi
          echo "Self-test OK: ${heading_count} heading-form, ${string_count} string-form, ${required_count} anchor-required, ${last_line_count} anchor-not-on-last-line, ${unique_count} anchor-not-unique-in-range, ${straddle_count} test-range-straddles-block, and ${heading_section_count} heading-section-form finding(s) against the drifted fixture."

      - name: Anchor-citation guard
        shell: bash
        run: |
          set +e
          # --require-anchors applies to the whole bundle with no
          # exemption: every full citation into an in-repo file must
          # carry an anchor (history: docs/okf/log.md).
          okf-kit check --json "${BUNDLE_PATH}" \
            --require-anchors \
            > okf-anchor-report.json
          code=$?
          set -e

          if [ "${code}" -ne 0 ] && [ "${code}" -ne 1 ]; then
            echo "::error title=OKF anchor guard::okf-kit check exited ${code} (tool/usage error, not bundle findings)"
            cat okf-anchor-report.json || true
            exit "${code}"
          fi

          jq -e . okf-anchor-report.json > /dev/null

          # Anchor rule ids are embedded as a "[rule-id]" suffix on the
          # citations-resolve finding's message (okf-kit's top-level
          # ruleId is always "citations-resolve"); match any anchor-*
          # rule id rather than a hardcoded list, so a future okf-kit
          # release adding another anchor-* rule is covered without an
          # edit here (the self-test step above guards a copy of this
          # filter, kept in sync by hand: an edit here is not exercised
          # by the self-test). That wildcard covers only future
          # anchor-* rule ids: test-range-straddles-block and
          # heading-section-* are matched by name below, not by the
          # wildcard, since neither id starts with "anchor-".
          # test-range-straddles-block is one of --require-anchors' own
          # four opt-in rules (see the Install step above).
          # heading-section-* covers okf-kit 0.8.0's line-independent
          # `path.md:#heading` citation form
          # (heading-section-not-found/-ambiguous/-empty and its
          # content-anchor and malformed-attempt variants), which the
          # bundle's CHANGELOG.md citations were migrated to; without
          # this branch the filter silently stopped seeing drift in that
          # form.
          anchorFindings=$(jq '[
            .findings[]
            | select(.message | test("\\[(anchor-[a-z-]+|heading-section-[a-z-]+|test-range-straddles-block)\\]$"))
          ]' okf-anchor-report.json)
          count=$(echo "${anchorFindings}" | jq 'length')

          {
            echo "## OKF bundle anchor guard (\`${BUNDLE_PATH}\`)"
            echo ""
            echo "anchor findings: ${count}"
            if [ "${count}" -gt 0 ]; then
              echo ""
              echo '```'
              echo "${anchorFindings}" | jq -r '.[] | "\(.file): \(.message)"'
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${count}" -gt 0 ]; then
            echo "${anchorFindings}" | jq -r '.[] | "::error title=OKF anchor drift::\(.file): \(.message)"'
            exit 1
          fi

          echo "Clean, 0 anchor findings."
          exit 0

      - name: Self-test the freshness-finding filter against a synthetic report
        # Guards the jq pipeline in the "Freshness guard" step below, not
        # the bundle: builds a throwaway inline report (not a real okf-kit
        # invocation, since the filter only cares about JSON shape) with
        # one sources-fresh warning, one sources-fresh-future error, and
        # one sources-fresh-future notice, then runs the job-level
        # `FRESHNESS_FILTER` env var -- the IDENTICAL expression text the
        # step below reads, not a separately hand-kept copy of it, so an
        # edit to the real filter is exercised here too instead of silently
        # bypassing this self-test -- and asserts it keeps exactly the
        # warning and the error (2) while dropping the notice -- mirrors
        # the neighbouring Anchor-citation guard self-test's shape,
        # assert_numeric guard included, so a jq pipeline that produces no
        # usable output fails here rather than falling through an `if`
        # condition `set -e` does not catch. If this ever returns anything
        # other than 2, the filter itself is broken (a typo, a severity the
        # tool stopped emitting) and this step fails red before the real
        # check below can pass green for the wrong reason.
        # `if: success() || failure()`, same reasoning as the real step
        # below: this is a pure self-test with no bundle dependency, so it
        # should still run (and still be able to fail red) after an earlier
        # Anchor-citation guard finding, just not after a cancellation.
        if: success() || failure()
        shell: bash
        run: |
          set -e
          # Same helper, same reason as the Anchor-citation guard self-test
          # above: an empty/non-numeric count inside a `[ "${x}" -ne 2 ]`
          # test is a shell usage error, and `set -e` exempts condition
          # commands, so without this the step would report "Self-test OK"
          # on a broken pipeline.
          assert_numeric() {
            case "$2" in
              ''|*[!0-9]*)
                echo "::error title=OKF freshness guard self-test failed::${1} is not a numeric finding count (got \"${2}\"); the jq pipeline produced no usable output"
                exit 1
                ;;
            esac
          }
          syntheticReport=$(jq -n '{
            findings: [
              {ruleId: "sources-fresh", severity: "warning", file: "a.md", message: "STALE: x"},
              {ruleId: "sources-fresh-future", severity: "error", file: "b.md", message: "FUTURE-DATED: y"},
              {ruleId: "sources-fresh-future", severity: "notice", file: "c.md", message: "future-dated check skipped"}
            ]
          }')

          matched=$(echo "${syntheticReport}" | jq "${FRESHNESS_FILTER} | length")

          assert_numeric matched "${matched}"
          if [ "${matched}" -ne 2 ]; then
            echo "::error title=OKF freshness guard self-test failed::expected 2 findings to survive the filter (the warning and the error), got ${matched}"
            exit 1
          fi

          echo "Self-test OK: freshness filter kept 2/3 synthetic findings (dropped the notice)."

      - name: "Freshness guard (strict): sources-fresh + sources-fresh-future"
        # Reuses okf-anchor-report.json from the Anchor-citation guard step
        # above (one `okf-kit check` invocation already ran every rule
        # against BUNDLE_PATH, --require-anchors only adds MORE
        # citations-resolve checks to that same run, it never removes any
        # other rule's findings). This is the strict half of the review
        # class named in okf-kit's CHANGELOG.md "Fixed"/"Added" entries: a
        # bundle doc edited (or its declared source changed) without a
        # correct re-stamp, previously only caught by the warn-only
        # okf-staleness.yml watch. Filters by rule id, not a fixed message
        # pattern or a hardcoded release note: matches sources-fresh and
        # sources-fresh-future by rule id, whichever the installed okf-kit
        # emits, so a future pin bump needs no edit here.
        # `if: success() || failure()`: the Anchor-citation guard step above
        # writes okf-anchor-report.json before it can itself exit 1 on an
        # anchor finding, so this step's findings should surface in the same
        # CI round rather than being skipped after an anchor failure. NOT
        # `always()`, which would also run after a cancellation and after an
        # earlier setup step failed (no okf-kit installed, no report written)
        # and stack a jq file-open error on top of the real failure; the
        # explicit report-missing guard below is what turns a genuinely
        # absent report into one readable annotation.
        if: success() || failure()
        shell: bash
        run: |
          if [ ! -f okf-anchor-report.json ]; then
            echo "::error title=OKF freshness guard::the anchor guard step did not produce a report"
            exit 1
          fi

          jq -e . okf-anchor-report.json > /dev/null

          freshnessFindings=$(jq "${FRESHNESS_FILTER}" okf-anchor-report.json)
          count=$(echo "${freshnessFindings}" | jq 'length')

          {
            echo "## OKF bundle freshness guard (\`${BUNDLE_PATH}\`), strict"
            echo ""
            echo "freshness findings: ${count}"
            if [ "${count}" -gt 0 ]; then
              echo ""
              echo '```'
              echo "${freshnessFindings}" | jq -r '.[] | "\(.ruleId) \(.file): \(.message)"'
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${count}" -gt 0 ]; then
            echo "${freshnessFindings}" | jq -r '.[] | "::error title=OKF freshness drift::\(.ruleId) \(.file): \(.message)"'
            exit 1
          fi

          echo "Clean, 0 freshness findings (strict)."
          exit 0

  lint-cli-flag-order:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check commander flag order (-short, --long)
        run: node scripts/check-cli-flag-order.mjs

  lint-format-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check ci job matrix.package covers every packages/*/package.json
        run: node scripts/check-format-check-matrix.mjs

  lint-package-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check every non-private package ships a matching LICENSE
        run: node scripts/check-package-licenses.mjs

  lint-release-changelogs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/check-release-changelogs.mjs' rule 2 (fresh-unreleased)
          # reads a package's package.json version at a base commit via
          # `git show`; a shallow checkout would not have that commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check release CHANGELOG hygiene and log.md anchor mentions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero="0000000000000000000000000000000000000000"
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "${zero}" ]; then
            node scripts/check-release-changelogs.mjs
          else
            node scripts/check-release-changelogs.mjs --base "${BASE_SHA}"
          fi


  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - agent-dev-kit
          - agent-primitives
          - friction-log
          - git-batch-cli
          - github-api-tool
          - mcp-token-audit
          - okf-kit
          - orchestrator-workflow
          - slop-detector
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
        with:
          # agent-primitives' ledger test compares every reachable release
          # tag with its packaged skill asset, so the matrix checkout needs
          # history and tags rather than Actions' default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Typecheck (test files)
        shell: bash
        run: |
          if node -e "process.exit((require('./package.json').scripts || {})['typecheck:test'] ? 0 : 1)"; then
            npm run typecheck:test
          elif [ -f tsconfig.json ]; then
            echo "::error::package has a tsconfig.json but no typecheck:test script - test files would go untypechecked"
            exit 1
          else
            echo "No tsconfig.json (plain JS package), skipping test typecheck"
          fi

      - name: Build
        run: npm run build --if-present

      - name: Lint
        run: npm run lint --if-present

      # Probed dynamically per matrix entry, like Typecheck (test files)
      # above: a package that defines `format:check` runs it. A package
      # that ships TypeScript sources (src/**/*.ts) but no `format:check`
      # script fails closed instead of silently going unchecked. A package
      # with neither the script nor TS sources under src/ (a plain-JS
      # package) is skipped. This rule only reaches packages listed in the
      # `matrix.package` list above; scripts/check-format-check-matrix.mjs
      # (wired as the lint-format-matrix job) guards that every
      # packages/*/package.json directory is a matrix entry.
      - name: Format check
        shell: bash
        run: |
          if node -e "process.exit((require('./package.json').scripts || {})['format:check'] ? 0 : 1)"; then
            npm run format:check
          elif [ -n "$(find src -type f -name '*.ts' -print -quit 2>/dev/null)" ]; then
            echo "::error::package ships TypeScript sources (src/**/*.ts) but no format:check script - files would go format-unchecked"
            exit 1
          else
            echo "No format:check script and no TypeScript sources under src/, skipping format check"
          fi

      - name: Test
        shell: bash
        run: |
          if node -e "process.exit((require('./package.json').scripts || {})['test:ci'] ? 0 : 1)"; then
            echo "Running npm run test:ci"
            npm run test:ci
          else
            echo "test:ci not defined, falling back to npm test"
            npm test --if-present
          fi
