name: OKF staleness

# Warn-only drift watch for the packages/orchestrator-workflow/docs/okf
# knowledge bundle: surfaces STALE curated docs (source files that changed
# after the doc's verification timestamp) on every PR without ever blocking
# a merge. Deliberately a separate workflow: ci.yml must stay a blocking
# gate, this one never is. Never mark this check as required in branch
# protection: a PR that removes or renames the bundle goes red here by
# design (tool-error posture, exit 2), and warn-only must stay
# non-blocking. Canonical pattern shared by every repo that ships a
# docs/okf bundle (find them by this workflow's file name); keep them
# in sync. agent-dx specifics: per-package bundle granularity
# (see the 2026-07-16 pilot decision), so the path below targets the
# orchestrator-workflow package bundle; additional per-package bundles
# each get their own path here. The "Install okf-kit" step's
# unpublished-pin fallback (build from packages/okf-kit and install that
# build) is also agent-dx-specific: only agent-dx ships the okf-kit
# package itself, so only it has a packages/okf-kit tree to build from.
# A repo that only consumes okf-kit should copy the published-pin branch
# as the canonical pattern and drop the fallback branch (see
# packages/orchestrator-workflow/docs/okf/log.md).

on:
  pull_request:
    # The one repo-specific line in the canonical pattern: set this to the
    # target repo's default branch when porting; a wrong name here means
    # the watch silently never runs.
    branches: [master]

permissions:
  contents: read

jobs:
  okf-staleness:
    name: OKF bundle staleness (warn-only)
    runs-on: ubuntu-latest

    env:
      BUNDLE_PATH: packages/orchestrator-workflow/docs/okf

    steps:
      - uses: actions/checkout@v5
        with:
          # sources-fresh derives per-path change times from `git log %ct`;
          # a shallow clone silently reports wrong staleness verdicts.
          # Note: on pull_request this checks out the ephemeral merge ref
          # (PR merged into base), so verdicts can differ from a local run
          # on the branch tip when the base has advanced. Deterministic,
          # just a different commit than a naive local run.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # 22 = active LTS, matching ci.yml.
          node-version: 22

      - name: Install okf-kit (exact pin, unpublished-pin fallback)
        # Exact pin: okf-kit@0.3.0 on npm is a deprecated silent no-op
        # (exit 0, no output). The output assertion below exists to catch
        # any regression of that failure mode: never assert on exit code
        # alone here.
        #
        # Probe the pin with `npm view okf-kit@<pin> version` first:
        # published, install exactly as before, no drift. If that probe
        # fails, confirm with a package-level probe (`npm view okf-kit
        # versions --json`) before deciding anything: if the pin turns up
        # in that list after all, install it exactly like a published pin;
        # if the probe confirms the pin is genuinely absent, build
        # packages/okf-kit from the PR tree and install that build when
        # the pin equals packages/okf-kit/package.json's version in this
        # tree (a release PR in flight, see CONTRIBUTING.md "Releasing
        # okf-kit"), or fail loudly when it does not (a stale bump, a
        # typo). Any failure of the package-level probe itself is a
        # registry/network error, never "unpublished": fail loudly rather
        # than guess. Each path prints one line naming which branch ran.
        # This fallback branch is agent-dx-specific: only agent-dx builds
        # okf-kit from its own tree (it ships the okf-kit package itself);
        # a repo that only consumes okf-kit and copies this file as the
        # canonical warn-only pattern should keep the published-pin branch
        # and drop the fallback branch, since it has no packages/okf-kit
        # tree to build from.
        #
        # Evidence: see packages/orchestrator-workflow/docs/okf/log.md.
        shell: bash
        run: |
          install_cmd=(npm install -g okf-kit@0.16.0 --no-audit --no-fund)
          pin="${install_cmd[3]#*okf-kit@}"

          view_out="$(mktemp)"
          view_err="$(mktemp)"
          set +e
          npm view "okf-kit@${pin}" version >"${view_out}" 2>"${view_err}"
          view_exit=$?
          set -e
          view_stdout="$(cat "${view_out}")"
          view_stderr="$(cat "${view_err}")"
          rm -f "${view_out}" "${view_err}"

          if [ "${view_exit}" -eq 0 ] && [ -n "${view_stdout}" ]; then
            echo "okf-kit install path: published-pin (okf-kit@${pin})"
            "${install_cmd[@]}"
            exit 0
          fi

          hint="no E404/ETARGET code seen (informational only, not decisive)"
          case "${view_stderr}" in
            *'code E404'*) hint="stderr showed code E404 (informational only, not decisive)" ;;
            *'code ETARGET'*) hint="stderr showed code ETARGET (informational only, not decisive)" ;;
          esac

          versions_out="$(mktemp)"
          versions_err="$(mktemp)"
          set +e
          npm view okf-kit versions --json >"${versions_out}" 2>"${versions_err}"
          versions_exit=$?
          set -e
          versions_stdout="$(cat "${versions_out}")"
          versions_stderr="$(cat "${versions_err}")"
          rm -f "${versions_out}" "${versions_err}"

          versions_json_valid=0
          if [ "${versions_exit}" -eq 0 ] && [ -n "${versions_stdout}" ]; then
            if node -e 'const v = JSON.parse(process.argv[1]); if (!Array.isArray(v)) process.exit(1);' "${versions_stdout}" >/dev/null 2>&1; then
              versions_json_valid=1
            fi
          fi

          if [ "${versions_json_valid}" -ne 1 ]; then
            echo "okf-kit install path: registry-error (fail)"
            single_line_view_stderr="${view_stderr//$'\n'/ }"
            echo "::error title=okf-kit install::npm view okf-kit@${pin} version failed (exit ${view_exit}, ${hint}) and npm view okf-kit versions --json could not confirm it is unpublished (exit ${versions_exit}); refusing to guess: ${single_line_view_stderr}" >&2
            echo "npm view okf-kit@${pin} version stderr:"
            printf '%s\n' "${view_stderr}" | sed 's/^/  /'
            echo "npm view okf-kit versions --json stderr:"
            printf '%s\n' "${versions_stderr}" | sed 's/^/  /'
            if [ "${versions_exit}" -eq 0 ]; then
              exit 1
            fi
            exit "${versions_exit}"
          fi

          pin_in_versions=0
          if node -e 'const v = JSON.parse(process.argv[1]); process.exit(v.includes(process.argv[2]) ? 0 : 1);' "${versions_stdout}" "${pin}" >/dev/null 2>&1; then
            pin_in_versions=1
          fi

          if [ "${pin_in_versions}" -eq 1 ]; then
            echo "okf-kit install path: published-pin (okf-kit@${pin}, confirmed via okf-kit versions probe; ${hint})"
            "${install_cmd[@]}"
            exit 0
          fi

          pkg_version="$(node -p "require('./packages/okf-kit/package.json').version" 2>/dev/null)" || {
            echo "::error title=okf-kit install::cannot read packages/okf-kit/package.json" >&2
            exit 1
          }
          if [ -z "${pkg_version}" ]; then
            echo "::error title=okf-kit install::cannot read packages/okf-kit/package.json" >&2
            exit 1
          fi

          if [ "${pin}" = "${pkg_version}" ]; then
            echo "okf-kit install path: unpublished-pin-build-from-tree (okf-kit@${pin} == packages/okf-kit/package.json)"
            (cd packages/okf-kit && npm ci --no-audit --no-fund && npm run build)
            npm install -g ./packages/okf-kit --no-audit --no-fund
          else
            echo "okf-kit install path: unpublished-pin-mismatch (fail)"
            echo "::error title=okf-kit install::pin okf-kit@${pin} is confirmed unpublished (via npm view okf-kit versions --json) and does not equal packages/okf-kit/package.json's version (${pkg_version}); refusing to install" >&2
            exit 1
          fi

      - name: Assert CLI is alive (output, not exit code)
        shell: bash
        run: |
          v="$(okf-kit --version)"
          test -n "$v"
          echo "okf-kit ${v}"

      - name: Check bundle (warn-only)
        shell: bash
        run: |
          # Exit contract of `okf-kit check` (no --strict): 0 = clean or
          # warnings/notices only (STALE is a warning), 1 = structural
          # errors present, 2 = usage/tool error. 0 and 1 are bundle
          # findings: report them and stay green. Anything else means the
          # check itself broke and must fail red, a broken check never
          # looks green.
          set +e
          okf-kit check --json "${BUNDLE_PATH}" > okf-report.json
          code=$?
          set -e

          if [ "${code}" -ne 0 ] && [ "${code}" -ne 1 ]; then
            echo "::error title=OKF staleness::okf-kit check exited ${code} (tool/usage error, not bundle findings)"
            cat okf-report.json || true
            exit "${code}"
          fi

          # Truncated or non-JSON output is a tool failure, not findings.
          jq -e . okf-report.json > /dev/null

          errors=$(jq '.summary.errors' okf-report.json)
          warnings=$(jq '.summary.warnings' okf-report.json)
          notices=$(jq '.summary.notices' okf-report.json)

          {
            echo "## OKF bundle check (\`${BUNDLE_PATH}\`), warn-only"
            echo ""
            echo "errors: ${errors} · warnings: ${warnings} · notices: ${notices}"
            echo ""
            if [ "$(jq '.findings | length' okf-report.json)" -gt 0 ]; then
              echo '```'
              jq -r '.findings[] | "\(.severity | ascii_upcase) \(.ruleId) \(.file): \(.message)"' okf-report.json
              echo '```'
              echo ""
              echo "A sources-fresh STALE warning means a \`sources:\` path"
              echo "changed after the doc's verification timestamp: re-verify"
              echo "the doc against the source, then update its timestamp."
              echo "A sources-fresh-future FUTURE-DATED warning means the doc's"
              echo "\`timestamp\` is later than the doc file's own last commit,"
              echo "past a small clock-skew allowance: almost always a local"
              echo "wall-clock time hand-written with a Z/UTC suffix it does"
              echo "not actually have; re-stamp with the real verification"
              echo "instant instead. Findings are matched by rule id, whichever"
              echo "the installed okf-kit emits, so a future pin bump needs no"
              echo "edit here."
              echo "A citations-resolve warning (including blank-start-line,"
              echo "closing-brace-start-line, missing-file, inverted-range,"
              echo "range-exceeds-file, path-traversal-rejected) means a"
              echo "\`path:N\`/\`path:N-M\` citation"
              echo "in the doc's prose no longer points at real content, even"
              echo "though the source file itself is not stale: re-check the"
              echo "citation against the file's current line numbers and"
              echo "correct it (no timestamp bump needed for this rule alone)."
              echo "A citations-resolve notice (ambiguous target,"
              echo "unreadable-target) is informational only and never counts"
              echo "toward --strict. This job never blocks either way."
            else
              echo "Clean, no findings."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          # GitHub caps workflow-command annotations at 10 per type per
          # step, so aggregate per doc (not per finding); the complete list
          # is in the step summary either way.
          jq -r '
            [.findings[] | select(.severity == "warning")]
            | group_by(.file)[]
            | "\(.[0].file): \(length) warning(s) (stale sources and/or unresolved citations), full list in the job summary"
          ' okf-report.json | while IFS= read -r line; do
            echo "::warning title=OKF bundle drift::${line}"
          done

          jq -r '
            [.findings[] | select(.severity == "error")]
            | group_by(.file)[]
            | "\(.[0].file): \(length) structural error(s), full list in the job summary"
          ' okf-report.json | while IFS= read -r line; do
            echo "::error title=OKF bundle broken::${line}"
          done

          exit 0
